[project]
name = "galenica-forecast-demo"
version = "0.1.0"
description = "Galenica demand-forecasting demo — Databricks App (FastAPI + React)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "psycopg[binary,pool]>=3.2.0",
    "databricks-sdk>=0.40.0",
    "databricks-sql-connector>=3.6.0",
    "openai>=1.54.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "mlflow>=2.19.0",
    "faker>=30.0.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
]

[tool.uv]
package = false
