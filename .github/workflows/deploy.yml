# Optional CI/CD: validate on PR, deploy on push to main.
# Configure these repo secrets/variables:
#   secrets.DATABRICKS_HOST          e.g. https://adb-xxxx.azuredatabricks.net
#   secrets.DATABRICKS_CLIENT_ID     service principal (OAuth M2M)
#   secrets.DATABRICKS_CLIENT_SECRET
#   vars.WAREHOUSE_ID                target SQL warehouse id
name: deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --strict -t ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        env:
          BUNDLE_VAR_warehouse_id: ${{ vars.WAREHOUSE_ID }}

      - name: Deploy bundle (main only)
        if: github.ref == 'refs/heads/main'
        run: databricks bundle deploy -t prod
        env:
          BUNDLE_VAR_warehouse_id: ${{ vars.WAREHOUSE_ID }}
